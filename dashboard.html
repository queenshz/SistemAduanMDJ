<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Sistem Aduan Majlis Daerah Jerantut</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7dc;
    }

    /* HEADER */
    .header-wrapper {
      background: linear-gradient(to right, #a3dfa3, #033103);
    }

    .header {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(to bottom right, #f2f2f2, #e6e6e6);
      text-align: center;
      padding: 30px 20px 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 15px;
      background: linear-gradient(135deg, yellow 50%, transparent 50%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: bold;
      color: black;
      text-shadow: 1px 1px 3px #000;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #555;
    }

    /* DASHBOARD LAYOUT */
    .dashboard {
      display: flex;
      height: calc(100vh - 180px); /* lepas header sahaja */
    }

    .sidebar {
      width: 240px;
      background: linear-gradient(to right, #a3dfa3, #033103);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 20px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.2);
    }

    .sidebar .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar .menu a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .sidebar .menu a:hover {
      background-color: #a3dfa3;
      color: #033103;
    }

    .logout-btn {
      background-color: white;
      color: #033103;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s ease;
      width: 100%;
    }

    .logout-btn:hover {
      background-color: #a3dfa3;
      color: #033103;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }

    .content {
      flex: 1;
      padding: 40px;
      background-color: #f4f7dc;
    }

    .content h2 {
      color: #033103;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .content p {
      font-size: 18px;
      color: #333;
    }

    @media (max-width: 768px) {
      .dashboard {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
      }

      .sidebar .menu {
        flex-direction: row;
        gap: 10px;
      }

      .logout-btn {
        width: auto;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-wrapper">
    <div class="header">
      <img src="logoMDJ1.png" alt="logo">
      <h1>Majlis Daerah Jerantut</h1>
      <p>Perkhidmatan</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div class="sidebar">
      <div class="menu">
        <a href="#">Halaman Utama</a>
        <a href="#">Senarai Aduan</a>
        <a href="#">Kemaskini Status</a>
      </div>
      <button class="logout-btn">Log Keluar</button>
    </div>

    <div class="content">
      <h2>Selamat Datang</h2>
      <p>Gunakan menu di sebelah kiri untuk menguruskan sistem aduan anda.</p>
    </div>
  </div>

</body>
</html>
