<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <title>Login Admin - Sistem Aduan</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #a3dfa3, #033103);
    }
    .header-wrapper {
      background: linear-gradient(to right, #a3dfa3, #033103);
      padding: 0;
    }
    .header {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(to bottom right, #f2f2f2, #e6e6e6);
      text-align: center;
      padding: 30px 20px 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }
    .header::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 15px;
      background: linear-gradient(135deg, yellow 50%, transparent 50%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    .header img {
      width: 90px;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: bold;
      color: black;
      text-shadow: 1px 1px 3px #000;
    }
    .header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #555;
    }
    .login-container {
      background-color: #f4f7dc;
      width: 90%;
      max-width: 300px;
      margin: 50px auto;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #033103;
      margin-bottom: 30px;
    }
    label {
      font-weight: bold;
      color: #033103;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .login-button {
      background-color: #084b08;
      color: white;
      padding: 10px;
      width: 100%;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .login-button:hover {
      background-color: #bce3aa;
      color: #033103;
    }
  </style>
</head>
<body>

  <div class="header-wrapper">
    <div class="header">
      <img src="logoMDJ1.png" alt="logo" />
      <h1>Majlis Daerah Jerantut</h1>
      <p>Log Masuk Pentadbir</p>
    </div>
  </div>

  <div class="login-container">
    <h2>Log Masuk Admin</h2>
    <form action="AdminLogin.php" method="POST">
      <label for="admin_id">ID Admin</label>
      <input type="text" id="admin_id" name="admin_id" required />

      <label for="password">Kata Laluan</label>
      <input type="password" id="password" name="password" required />

      <button type="submit" class="login-button">Log Masuk</button>
    </form>
  </div>

</body>
</html>
