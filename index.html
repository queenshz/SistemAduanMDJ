<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sistem Aduan Majlis Daerah Jerantut</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #a3dfa3, #033103);
    }

    /* WRAPPER utk tengahkan header putih */
    .header-wrapper {
      background: linear-gradient(to right, #a3dfa3, #033103);
      padding: 0;
    }

    /* Header utama */
    .header {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(to bottom right, #f2f2f2, #e6e6e6);
      text-align: center;
      padding: 30px 20px 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }

    /* Border bawah condong warna emas */
    .header::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 15px;
      background: linear-gradient(135deg, yellow 50%, transparent 50%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: bold;
      color: black;
      text-shadow: 1px 1px 3px #000;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #555;
    }

    .navbar {
      background-color: #084b08;
      overflow: hidden;
      text-align: center;
      padding: 10px 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
    }

    .content-box {
      background-color: #f4f7dc;
      width: 70%;
      max-width: 420px;
      margin: 60px auto;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .content-box h2 {
      color: black;
      margin-bottom: 30px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 25px;
    }

    .start-button {
      background-color: #084b08;
      color: white;
      padding: 12px 35px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .start-button:hover {
      background-color: #bce3aa;
      color: #033103;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .navbar a {
        display: block;
        margin: 10px 0;
      }

      .content-box {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="header-wrapper">
    <div class="header">
      <img src="logoMDJ1.png" alt="logo">
      <h1>Majlis Daerah Jerantut</h1>
      <p>Perkhidmatan</p>
    </div>
  </div>

  <div class="navbar">
    <a href="index.html">Laman Utama</a>
    <a href="TentangKami.html">Tentang Kami</a>
    <a href="AdminLogin.html">Admin</a>
  </div>

  <div class="content-box">
    <h2>SELAMAT DATANG KE SISTEM ADUAN</h2>
    <button class="start-button" onclick="window.location.href='BorangAduan.html'">Mula</button>
  </div>

</body>
</html>
