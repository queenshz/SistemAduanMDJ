<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Borang Aduan - Majlis Daerah Jerantut</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #a3dfa3, #033103);
    }

    .header-wrapper {
      background: linear-gradient(to right, #a3dfa3, #033103);
      padding: 0;
    }

    .header {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(to bottom right, #f2f2f2, #e6e6e6);
      text-align: center;
      padding: 30px 20px 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 15px;
      background: linear-gradient(135deg, yellow 50%, transparent 50%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: bold;
      color: black;
      text-shadow: 1px 1px 3px #000;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #555;
    }

    .form-container {
      background-color: #f4f7dc;
      width: 80%;
      max-width: 600px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #033103;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #033103;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .submit-button {
      background-color: #084b08;
      color: white;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 30px;
      display: block;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .submit-button:hover {
      background-color: #bce3aa;
      color: #033103;
    }

    @media (max-width: 768px) {
      .form-container {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="header-wrapper">
    <div class="header">
      <img src="logoMDJ1.png" alt="logo">
      <h1>Majlis Daerah Jerantut</h1>
      <p>Borang Aduan Awam</p>
    </div>
  </div>

  <div class="form-container">
    <h2>Borang Aduan Pengguna</h2>
    <form action="prosesAduan.php" method="POST">
      <label for="nama">Nama Penuh</label>
      <input type="text" id="nama" name="nama" required>

      <label for="telefon">No Telefon</label>
      <input type="tel" id="telefon" name="telefon" pattern="[0-9]{10,11}" required placeholder="Contoh: 0123456789">

      <label for="lokasi">Lokasi Kejadian</label>
      <input type="text" id="lokasi" name="lokasi" required>

      <label for="kategori">Kategori Aduan</label>
      <select id="kategori" name="kategori" required>
        <option value="">-- Sila Pilih --</option>
        <option value="Kebersihan Awam">Kebersihan Awam</option>
        <option value="Infrastruktur">Jalan & Infrastruktur</option>
        <option value="Penguatkuasaan">Penguatkuasaan</option>
        <option value="Gangguan Awam">Gangguan Awam</option>
        <option value="Landskap & Taman">Landskap & Taman</option>
        <option value="Perparitan & Banjir">Perparitan & Banjir</option>
        <option value="Pembinaan & Bangunan">Pembinaan & Bangunan</option>
        <option value="Pencemaran Alam">Pencemaran Alam</option>
        <option value="Aduan Am">Aduan Am</option>
      </select>

      <label for="butiran">Butiran Aduan</label>
      <textarea id="butiran" name="butiran" required></textarea>

      <button type="submit" class="submit-button">Hantar</button>
    </form>
  </div>

  <script>
    document.getElementById("aduanForm").addEventListener("submit", function(e) {
      e.preventDefault(); // Halang hantar form default

      // Papar mesej alert
      alert("Aduan Berjaya Dihantar!");

      // Selepas tekan OK, redirect ke index.html
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
